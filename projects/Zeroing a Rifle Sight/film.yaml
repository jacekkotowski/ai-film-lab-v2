        words: [0.00, 0.31, 0.49, 0.58, 0.78, 1.24, 1.40, 1.61]
      - text: "glance through the sight and turn the ring until"
        at: 7.12
        dur: 2.32
        pos: lower_third
        words: [0.00, 0.16, 0.61, 0.78, 1.09, 1.39, 1.60, 1.78, 2.00]
      - text: "the reticle looks sharp at once."
        at: 9.80
        dur: 1.39
        pos: lower_third
        words: [0.00, 0.10, 0.45, 0.66, 0.94, 1.10]
      - text: "Then turning the elevation turret"
        at: 12.08
        dur: 1.65
        pos: lower_third
        words: [0.00, 0.47, 0.73, 0.92, 1.34]
