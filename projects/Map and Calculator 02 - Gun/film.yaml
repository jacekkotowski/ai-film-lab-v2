# Written by `film init`. Everything here is a starting point.
# Change the numbers. That is what this file is for.
#
# Filename hints `init` understood, if you used any:
#   00_ 01_ ...     explicit order
#   open_ close_    which shot opens / closes the film
#   open_close_     the SAME image opens AND closes it
#   quote_          held longer, filename becomes a centered title
#
#   uv run film peek    seconds    -- is the ORDER right?
#   uv run film draft   <1 min     -- does the MOTION feel right?
#   uv run film final   minutes    -- ship it

fps: 24
resolution: [1080, 1920]   # vertical, for YouTube Shorts
# Each picture carries its own piece of
# media/voiceover_20261011-153921.wav -- see `voice:` below.
# title: the words on the thumbnail. Left out, the film is
#        called what its folder is called.
# music: found on its own -- this project's music/ folder if it
#        has one, otherwise your library/music/ folder.
music_volume: 0.6      # the level when nobody is talking
music_fade: 2.0        # seconds of fade in and out
music_duck: 0.5        # how far the music drops while you talk
                       # 0 = never drops. 1 = gets right out of the way

look:
  preset: old_film      # clean | warm | old_film | projector
  glow: 0.25            # lifts shadows -- better lighting

# Uncomment if a wide clip is losing too much to a tall frame.
# `blur` keeps the picture whole on a blurred copy of itself
# instead of cropping it. fill_aspect is the shape of the sharp
# part: 1.0 square, 0.8 taller and bigger, 1.33 shorter and safer.
# fill: blur
# fill_aspect: 1.0

# The room behind you softly blurred, you sharp -- on your own
# recordings (rec_*) only. 0 = off, 2 = twice as soft. About +45%
# render time. Barely shows in a vertical close-up: the crop is
# nearly all face. Another clip can ask for it with its own `bokeh:`.
bokeh: 1

# Photographs with depth: as the camera moves, what is near
# slides past what is far (parallax). 0 = flat. Photos only;
# a .png .gif .svg is a chart and stays flat by itself.
# 0.8 smears. Needs `uv sync --extra depth` once, flat without
# it; see docs/decisions/0013.
depth: 0.5

