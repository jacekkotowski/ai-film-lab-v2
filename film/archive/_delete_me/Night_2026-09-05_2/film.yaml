  focus:
  - 0.572
  - 0.4
  dissolve: 0.3
  note: part 2 of 4 -- one take with the long pauses cut out. Every word is kept
  captions:
  - text: The other threw out the averages.
    at: 0.0
    dur: 2.66
    pos: lower_third
  - text: He was pulling fresh readings from weather balloons and ships and stations from Spain
      to Iceland, building a real-time picture instead of a historical one.
    at: 3.17
    dur: 4.5
    pos: lower_third
  - text: His model said a storm was forming, and the invasion had to wait.
    at: 14.2
    dur: 4.5
    pos: lower_third
