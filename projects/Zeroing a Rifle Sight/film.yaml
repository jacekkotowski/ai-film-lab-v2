  - id: s07
    src: media/close_rec_20261006-113139.mp4
    in: "00:00.90"
    out: "00:25.55"
    speed: 1.25              # 1.0 is the speed you actually spoke at
    move: static
    amount: 0.6            # how much of the move to use. 0 = none
    focus: [0.400, 0.375]
    note: "closer"
    captions:
      - text: "Before shooting, set the SLx diopter,"
        at: 0.24
        dur: 2.37
        pos: lower_third
        words: [0.00, 0.18, 0.90, 1.03, 1.29, 1.82]
      - text: "the ring that focuses the reticle."
        at: 2.84
