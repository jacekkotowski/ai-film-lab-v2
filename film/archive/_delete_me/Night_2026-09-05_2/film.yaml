  captions:
  - text: That's the actual conflict in the film "Pressure" — not weather versus war, but two
      ways of doing analysis, and a decision-maker who has to pick one under a deadline he can't
      move.
    at: 0.0
    dur: 4.5
    pos: lower_third
  - text: Every data team has lived some version of this.
    at: 13.63
    dur: 2.71
    pos: lower_third
  - text: The historical model is comfortable.
    at: 17.58
    dur: 2.09
    pos: lower_third
  - text: The real-time signal is inconvenient.
    at: 20.73
    dur: 2.83
    pos: lower_third
  - text: And the person who has to act on it isn't the one who built either model.
    at: 25.42
    dur: 4.41
    pos: lower_third
  - text: Eisenhower picked the harder read.
    at: 36.91
    dur: 1.71
    pos: lower_third
  - text: It was the right call.
    at: 40.01
    dur: 1.63
    pos: lower_third
