  captions:
  - text: Seventy-two hours before D-Day, Eisenhower had two analysts telling him two different
      things.
    at: 1.43
    dur: 4.5
    pos: lower_third
  - text: One used twenty years of historical averages.
    at: 9.12
    dur: 3.38
    pos: lower_third
  - text: June weather in Normandy was reliably calm — the pattern said go.
    at: 13.59
    dur: 3.75
    pos: lower_third
- id: s02
  src: media/rec_20260905-232339.mp4
  in: '00:23.12'
