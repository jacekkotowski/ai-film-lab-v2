[project]
name = "aimanim"
version = "0.0.1"
description = "Animated slides for narrated Shorts: a problem in words in, a vertical clip out."
requires-python = ">=3.11"
# The helpers in aimanim/ use the standard library only.
dependencies = []

[project.optional-dependencies]
# Only what renders. Not installed until PLAN step 1:  uv sync --extra render
render = ["manim>=0.19"]
# Things that fall, swing, collide (Jacek's yes, 2026-10-09; pymunk 7.3.0 measured
# on Python 3.13.5 / Windows). Not manim-physics: it pins manim 0.18, python <3.13.
physics = ["pymunk>=7.3"]

[tool.uv]
package = false
