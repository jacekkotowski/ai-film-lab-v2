# Edited in `film edit`. Comments are not preserved by the editor —
# use `note:` fields, which are data and survive.

fps: 24
resolution: [1080, 1920]

music_volume: 0.6
music_fade: 2.0
music_duck: 0.5
look:
  preset: old_film
  glow: 0.25

shots:

  - id: s01
    src: analysis/title.jpg
    duration: 4.0
    move: static
    ease: sine_in_out
    focus: [0.500, 0.500]
    note: "the opening card -- the same picture and the same words as the thumbnail, so clicking the miniature lands you on the frame you clicked. Made from your library; delete this whole block if you would rather open on yourself talking."

