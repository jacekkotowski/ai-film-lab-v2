  captions:
  - text: Seventy-two hours before D-Day,
    at: 0.68
    dur: 1.33
    pos: lower_third
  - text: Eisenhower had two analysts telling him two different things.
    at: 2.38
    dur: 4.43
    pos: lower_third
  - text: One used twenty years of historical averages.
    at: 8.71
    dur: 3.03
    pos: lower_third
  - text: June weather in Normandy was reliably calm —
    at: 12.41
    dur: 2.93
    pos: lower_third
  - text: the pattern said go.
    at: 16.01
    dur: 1.6
    pos: lower_third
  - text: The other threw out the averages.
    at: 19.77
    dur: 2.13
    pos: lower_third
  - text: He was pulling fresh readings from weather balloons and ships
    at: 22.45
    dur: 3.73
    pos: lower_third
  - text: and stations from Spain to Iceland,
    at: 26.18
    dur: 3.21
    pos: lower_third
  - text: building a real-time picture instead of a historical one.
    at: 30.05
    dur: 3.53
    pos: lower_third
  - text: His model said a storm was forming,
    at: 34.52
    dur: 2.23
    pos: lower_third
  - text: and the invasion had to wait.
    at: 36.75
    dur: 2.65
    pos: lower_third
  - text: That's the actual conflict in the film "Pressure" —
    at: 40.92
    dur: 2.93
    pos: lower_third
  - text: not weather versus war,
    at: 44.65
    dur: 2.33
    pos: lower_third
  - text: but two ways of doing analysis,
    at: 47.5
    dur: 1.96
    pos: lower_third
  - text: and a decision-maker who has to pick one
    at: 49.47
    dur: 3.81
    pos: lower_third
  - text: under a deadline he can't move.
    at: 54.12
    dur: 1.96
    pos: lower_third
  - text: Every data team has lived some version of this.
    at: 57.38
    dur: 3.39
    pos: lower_third
  - text: The historical model is comfortable.
    at: 61.95
    dur: 2.0
    pos: lower_third
  - text: The real-time signal is inconvenient.
    at: 64.62
    dur: 2.5
    pos: lower_third
  - text: And the person who has to act on it isn't the one
    at: 67.12
    dur: 4.5
    pos: lower_third
  - text: who built either model.
    at: 71.78
    dur: 1.73
    pos: lower_third
  - text: Eisenhower picked the harder read.
    at: 77.45
    dur: 2.74
    pos: lower_third
  - text: It was the right call.
    at: 81.62
    dur: 1.31
    pos: lower_third
